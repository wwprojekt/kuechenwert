# Security headers configuration for Nginx
# Provides comprehensive security headers for the application
# Note: HSTS should be set by the proxy (Dokploy/Cloudflare), not the origin server

# HSTS (HTTP Strict Transport Security)
# Only add if behind HTTPS proxy - commented out as proxy handles this
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# Prevent clickjacking attacks
add_header X-Frame-Options "DENY" always;

# Prevent MIME type sniffing
add_header X-Content-Type-Options "nosniff" always;

# XSS Protection
add_header X-XSS-Protection "1; mode=block" always;

# Referrer Policy
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Permissions Policy (Feature Policy)
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;

# Note: Expect-CT is deprecated and no longer needed
# add_header Expect-CT "max-age=86400, enforce" always;

# Cross-Origin Policies
# Note: These are restrictive and can break external resources (fonts, analytics, etc.)
# Only enable if needed for specific security requirements
# add_header Cross-Origin-Embedder-Policy "require-corp" always;
# add_header Cross-Origin-Opener-Policy "same-origin" always;
# add_header Cross-Origin-Resource-Policy "same-site" always;

# Hide server information
# Note: more_clear_headers requires ngx_headers_more module (not in alpine image)
# Server header hiding is done via server_tokens off in server blocks
# server_tokens off;
