<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- Favicon — webp for smaller size, png fallback for Apple -->
    <link rel="icon" type="image/webp" href="/favicon.webp" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Preconnect for critical resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://iaotiligvhlhzlrpgdyk.supabase.co" />

    <!-- Preload hero image for fast LCP — responsive: mobile gets small version -->
    <link rel="preload" as="image" href="/images/hero-motorcycle.webp"
          imagesrcset="/images/hero-motorcycle-sm.webp 400w, /images/hero-motorcycle-md.webp 800w, /images/hero-motorcycle.webp 1920w"
          imagesizes="100vw" fetchpriority="high" />

    <!-- Google Fonts — loaded NON-BLOCKING via media trick.
         Browser loads CSS with media="print" (non-render-blocking),
         then switches to media="all" once loaded. display=swap shows
         system font immediately, swaps to Fira Sans when ready. -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700;800&display=swap" as="style" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700;800&display=swap" /></noscript>

    <!-- Primary Meta Tags -->
    <title>BikeWert - Deutschlands führende Motorrad-Handelsplattform</title>
    <meta name="description" content="Verkaufen Sie Ihr Motorrad schnell, sicher und zum besten Preis. Sofortpreis-Ankauf, Online-Auktion oder Übergabe an einer Ankaufstation - Sie haben die Wahl!" />
    <meta name="keywords" content="Motorrad verkaufen, Motorrad Ankauf, Quad verkaufen, Roller verkaufen, Motorrad Ankaufstation" />
    <meta name="author" content="BikeWert" />
    <meta name="robots" content="index, follow" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BikeWert" />
    <meta property="og:locale" content="de_DE" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- Structured Data - Organization Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": ["Organization", "LocalBusiness"],
      "name": "BikeWert",
      "description": "Deutschlands führende Motorrad-Handelsplattform",
      "url": "https://bikewert.de",
      "logo": "https://bikewert.de/og-image.png",
      "image": "https://bikewert.de/og-image.png",
      "email": "kontakt@bikewert.de",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "DE"
      },
      "areaServed": {
        "@type": "Country",
        "name": "Germany"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "Customer Service",
        "areaServed": "DE",
        "availableLanguage": "German"
      }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- ═══════════════════════════════════════════════════════════════════
         DEFERRED THIRD-PARTY SCRIPTS — loaded AFTER first paint
         These scripts are non-essential for initial page rendering.
         Loading them after the app improves FCP/LCP by 1-3 seconds on mobile.
         ═══════════════════════════════════════════════════════════════════ -->
    <script>
      function loadDeferredScripts() {
        // Cloudflare Turnstile (needs new site key for bikewert.de)
        var t = document.createElement('script');
        t.async = true;
        t.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
        document.head.appendChild(t);
      }

      if ('requestIdleCallback' in window) {
        requestIdleCallback(loadDeferredScripts, { timeout: 3000 });
      } else {
        setTimeout(loadDeferredScripts, 1500);
      }
    </script>
  </body>
</html>
