<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    
    <!-- Google Tag Setup -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      // gtag auf window setzen, damit es aus React/TypeScript erreichbar ist
      window.gtag = gtag;

      // Consent: Alles granted – Tracking läuft immer
      gtag('consent', 'default', {
        'ad_storage': 'granted',
        'ad_user_data': 'granted',
        'ad_personalization': 'granted',
        'analytics_storage': 'granted',
        'functionality_storage': 'granted',
        'personalization_storage': 'granted',
        'security_storage': 'granted'
      });
    </script>

    <!-- Google Tag (gtag.js) – Google Ads + GA4 -->
    <!-- Lädt gtag.js einmalig; konfiguriert Google Ads UND GA4 Property -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-H4BCV8DS0B"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      window.gtag = gtag;
      gtag('js', new Date());

      // Google Analytics 4 – CaravanWert Property
      gtag('config', 'G-H4BCV8DS0B', {
        send_page_view: true,
        cookie_domain: 'caravanwert.de',
        cookie_flags: 'SameSite=None;Secure',
      });

      // Google Ads – CaravanWert Konto (522-100-4970)
      gtag('config', 'AW-18033517246', {
        send_page_view: false,
      });
    </script>

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Primary Meta Tags (Fallback - wird von React/Helmet dynamisch überschrieben) -->
    <title>CaravanWert - Deutschlands führende Wohnmobil-Handelsplattform</title>
    <meta name="description" content="Verkaufen Sie Ihr Wohnmobil schnell, sicher und zum besten Preis. Sofortpreis-Ankauf, Online-Auktion oder Übergabe an einer Ankaufstation - Sie haben die Wahl!" />
    <meta name="keywords" content="Wohnmobil verkaufen, Wohnmobil Ankauf, Camper verkaufen, Reisemobil verkaufen, Wohnmobil Ankaufstation" />
    <meta name="author" content="CaravanWert" />
    <meta name="robots" content="index, follow" />
    
    <!-- Open Graph / Facebook (generische Fallback-Tags ohne seitenspezifische URLs) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CaravanWert" />
    <meta property="og:locale" content="de_DE" />
    
    <!-- Twitter (generische Fallback-Tags) -->
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- Structured Data - Organization Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": ["Organization", "LocalBusiness"],
      "name": "CaravanWert",
      "description": "Deutschlands führende Wohnmobil-Handelsplattform",
      "url": "https://caravanwert.de",
      "logo": "https://caravanwert.de/og-image.png",
      "image": "https://caravanwert.de/og-image.png",
      "telephone": "+49-511-51532476",
      "email": "kontakt@caravanwert.de",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Hannoversche Straße 106",
        "addressLocality": "Hannover",
        "postalCode": "30627",
        "addressCountry": "DE"
      },
      "areaServed": {
        "@type": "Country",
        "name": "Germany"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+49-511-51532476",
        "contactType": "Customer Service",
        "areaServed": "DE",
        "availableLanguage": "German"
      },
      "sameAs": [
        "https://www.instagram.com/caravanwert.de"
      ]
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
