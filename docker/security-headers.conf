# Sicherheits-Header für alle Antworten.
#
# nginx vererbt add_header nur an Blöcke ohne eigenes add_header. Jeder
# location-Block mit eigenen Headern muss diese Datei deshalb selbst per
# include einbinden, sonst fehlen dort CSP & Co.
#
# $kw_referrer_policy und $kw_robots_tag kommen aus den map-Blöcken in
# default.conf (Pfad der ursprünglichen Anfrage, gilt also auch nach internen
# Weiterleitungen). Ein leerer Wert lässt den Header weg.
#
# CSP: Google Tag (GA4, Google Ads, Consent Mode), Meta Pixel, Microsoft UET,
# Cloudflare Turnstile und Web Analytics, Supabase (REST, Realtime, Storage).
# script-src ohne 'unsafe-inline'/'unsafe-eval': Inline-Skripte gehören nach
# public/js/ (Prüfung: node scripts/check-csp.mjs). JSON-LD-Blöcke sind keine
# ausführbaren Skripte und bleiben erlaubt.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy $kw_referrer_policy always;
add_header X-Robots-Tag $kw_robots_tag always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://*.googletagmanager.com https://www.google-analytics.com https://googleads.g.doubleclick.net https://www.googleadservices.com https://www.google.com https://connect.facebook.net https://static.cloudflareinsights.com https://bat.bing.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; media-src 'self' https:; object-src 'none'; worker-src 'self' blob:; frame-src 'self' https://www.google.com https://www.youtube.com https://player.vimeo.com https://td.doubleclick.net https://www.googletagmanager.com https://challenges.cloudflare.com; connect-src 'self' https://*.supabase.co https://*.supabase.in wss://*.supabase.co https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://www.google.com https://www.google.de https://stats.g.doubleclick.net https://googleads.g.doubleclick.net https://ad.doubleclick.net https://www.googleadservices.com https://pagead2.googlesyndication.com https://td.doubleclick.net https://connect.facebook.net https://www.facebook.com https://bat.bing.com https://bat.bing.net https://static.cloudflareinsights.com https://cloudflareinsights.com https://challenges.cloudflare.com; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
