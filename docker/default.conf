# Default server configuration for KüchenWert (kuechenwert24.de)
# Optimized for Dokploy/Cloudflare (SSL termination at proxy)
# Origin server only listens on HTTP (port 80)

# Header-Werte je Pfad, genutzt in snippets/security-headers.conf.
# $request_uri ist der Pfad der ursprünglichen Anfrage und bleibt bei internen
# Weiterleitungen (try_files, error_page) gleich. Leerer Wert = kein Header.
# /projekt/* trägt ein persönliches Zugriffstoken in der URL: keinen Referrer
# senden und nicht indexieren. Admin und Dashboard gehören nicht in den Index.
map $request_uri $kw_referrer_policy {
    "~*^/projekt(?:[/?]|$)"               "no-referrer";
    "~*^/abmelden(?:[/?]|$)"              "no-referrer";
    default                               "strict-origin-when-cross-origin";
}

map $request_uri $kw_robots_tag {
    "~*^/projekt(?:[/?]|$)"               "noindex, nofollow";
    "~*^/abmelden(?:[/?]|$)"              "noindex, nofollow";
    "~*^/(?:admin|dashboard)(?:[/?]|$)"   "noindex";
    default                               "";
}

# Redirect www to non-www (handled at origin level)
server {
    listen 80;
    listen [::]:80;
    server_name www.kuechenwert24.de;
    return 301 https://kuechenwert24.de$request_uri;
}

# Main server block - HTTP only (SSL handled by proxy)
#
# HTML-Auslieferung:
#   - Bekannte SPA-Routen (Allowlist unten) → 200. Zuerst die per
#     scripts/prerender.mjs erzeugte Datei <route>/index.html, sonst die
#     unveränderte SPA-Shell /spa.html (ohne Prerendering: /index.html).
#   - Alles andere ohne passende Datei → echter 404 mit SPA-Shell, React
#     zeigt dort die NotFound-Seite. 404 werden nicht gecacht.
#   - Kein try_files mit "$uri/": das würde über den index-Mechanismus intern
#     auf ".../" weiterleiten und mit dem Trailing-Slash-Rewrite kollidieren.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    
    root /usr/share/nginx/html;
    index index.html;

    # Weiterleitungen relativ ausgeben (Location: /faq). nginx läuft hinter
    # Cloudflare/Traefik nur mit HTTP und würde sonst http://… als Ziel setzen.
    absolute_redirect off;

    # DNS resolver for proxy_pass (e.g. Supabase Edge Functions for sitemap.xml).
    # Uses Google + Cloudflare public DNS, since the alpine container has no
    # local resolver beyond /etc/resolv.conf which nginx ignores at runtime.
    resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;
    resolver_timeout 10s;

    # Trailing slash normalization: redirect /path/ to /path (except root)
    rewrite ^(.+)/$ $1 permanent;

    # Sicherheits-Header und CSP. Jeder location-Block mit eigenem add_header
    # bindet die Datei erneut ein (nginx vererbt add_header sonst nicht).
    include /etc/nginx/snippets/security-headers.conf;

    # Hide nginx version
    server_tokens off;

    # Health check endpoint
    location /health {
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }

    # Service Worker MUST never be cached aggressively, otherwise browsers
    # and CDNs hold on to old SW versions forever. Always revalidate.
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }

    # PWA manifest: revalidate on every load
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }

    # /index.html ist keine eigene Seite (sonst Duplikat der Startseite).
    # Nur externe Aufrufe landen hier: try_files unten liefert Dateien direkt
    # aus und leitet nie intern auf /index.html weiter.
    location = /index.html {
        return 301 /$is_args$args;
    }

    # Vite-Build-Artefakte unter /assets/ tragen einen Content-Hash im
    # Dateinamen und sind deshalb für immer cachebar.
    #
    # WICHTIG: try_files MUSS auf @asset_404 fallen, NICHT auf =404.
    # Grund: nginx wendet die add_header-Direktiven dieses Blocks (mit
    # `always`) auch auf 404-Antworten an. Damit bekäme ein 404 für einen
    # gelöschten Chunk Cache-Control: max-age=31536000, immutable und
    # Cloudflare cached den 404 für 1 JAHR. Ein einziger User der einen
    # alten Hash anfragt vergiftet damit den Edge-PoP für 12 Monate.
    # @asset_404 sendet stattdessen no-store für 4xx-Antworten.
    location ^~ /assets/ {
        expires 1y;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Vary "Accept-Encoding" always;
        add_header Access-Control-Allow-Origin "*" always;
        gzip_static on;
        try_files $uri @asset_404;
    }

    # Security: Block access to hidden files. Steht vor den übrigen
    # Regex-Blöcken, weil nginx den ersten passenden Regex-Block nimmt.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Security: Block access to sensitive files
    location ~* \.(env|log|htaccess|htpasswd|ini|phps|fla|psd|sh)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Statische Dateien aus public/ (Logos, Favicons, OG-Bild, Planer-Bilder)
    # behalten bei Updates ihren Dateinamen → kein immutable, sonst liefern
    # Cloudflare und Browser ein ersetztes Logo bis zu ein Jahr weiter aus.
    # Die Skripte unter /js/ bindet index.html mit ?v=<Inhalts-Hash> ein.
    #
    # webp/avif MÜSSEN drin sein — sonst fällt jedes WebP-Bild durch zum
    # SPA-Catch-all (location /) und bekommt no-cache,no-store-Headers
    # (CF-Cache-Status: BYPASS, Bug bis 2026-04-19).
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|eot|mp4|webm|ogg|pdf)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
        add_header Vary "Accept-Encoding" always;
        add_header Access-Control-Allow-Origin "*" always;
        gzip_static on;
        try_files $uri @asset_404;
    }

    # Named location für 404-Antworten auf Asset-Pfade.
    # Sendet Cache-Control: no-store, damit Cloudflare und Browser den 404
    # NICHT cachen. Sobald das fehlende Asset wieder verfügbar ist (z.B.
    # nach Old-Chunk-Preserve-Deploy oder Cache-Purge), bekommt der nächste
    # Request sofort die echte Datei.
    location @asset_404 {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, max-age=0" always;
        return 404;
    }

    # Handle API routes (proxy to Supabase if needed)
    location /api/ {
        # Rate limiting for API calls
        limit_req zone=api burst=20 nodelay;
        
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        
        # For SPA, this might not be needed since Supabase is external
        return 404;
    }

    # Sitemap - dynamically generated by Supabase Edge Function
    # Proxy /sitemap.xml to the public Edge Function so Google can crawl
    # https://kuechenwert24.de/sitemap.xml directly.
    # NOTE: hostname is in a variable so nginx uses the resolver at runtime
    # instead of only at startup (avoids stale-IP issues after Supabase deploys).
    location = /sitemap.xml {
        set $sitemap_upstream "gzqayoalwtmypndrmqes.supabase.co";
        proxy_pass https://$sitemap_upstream/functions/v1/sitemap;
        proxy_set_header Host $sitemap_upstream;
        proxy_ssl_server_name on;
        proxy_ssl_name $sitemap_upstream;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_http_version 1.1;
        proxy_set_header Accept-Encoding "";
        proxy_hide_header Cache-Control;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Content-Security-Policy;
        # Das Supabase-Gateway liefert Functions per GET als text/plain aus.
        proxy_hide_header Content-Type;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Type "application/xml";
        add_header Cache-Control "public, max-age=3600, s-maxage=3600";
    }

    # Alt-Routen (Caravan-Plattform, frühere Rechner-URLs) serverseitig per
    # 301 auf die Küchen-Seiten, Query-Parameter (UTM, gclid) bleiben erhalten.
    location = /verkaufen        { return 301 /formular$is_args$args; }
    location = /verkaufen/wizard { return 301 /formular$is_args$args; }
    location = /verkaufen/danke  { return 301 /funnel/danke$is_args$args; }
    location = /wertrechner      { return 301 /kuechenrechner$is_args$args; }
    location = /wertermittlung   { return 301 /kuechenrechner$is_args$args; }
    location = /kaufen           { return 301 /formular$is_args$args; }
    location ^~ /auktion/        { return 301 /formular$is_args$args; }
    location = /ankaufstationen  { return 301 /kuechenstudios$is_args$args; }
    location = /traumkueche      { return 301 /funnel/c$is_args$args; }

    # Vorgerenderte Dateien nicht unter zweiter URL (/faq/index.html → /faq).
    location ~ ^(.+)/index\.html$ {
        return 301 $1$is_args$args;
    }

    # Startseite: vorgerendert (dist/index.html) oder SPA-Shell.
    location = / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files /index.html =404;
    }

    # Öffentliche Seiten: vorgerenderte Datei, sonst SPA-Shell.
    location ~ ^/(?:kuechenstudios|kuechenrechner|formular|funnel/(?:a(?:/[a-z0-9-]+)?|b|c|danke)|ratgeber(?:/[a-z0-9-]+)?|ueber-uns|kontakt|haendler|impressum|datenschutz|agb|konditionen|faq|preise|blog(?:/[a-z0-9-]+)?|barrierefreiheit)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri/index.html /spa.html /index.html =404;
    }

    # Login/Registrierung mit strengerem Rate-Limit, immer SPA-Shell.
    location ~ ^/(?:login(?:/haendler)?|register(?:/(?:privat|haendler))?|forgot-password|reset-password|auth/confirm)$ {
        limit_req zone=auth burst=5 nodelay;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files /spa.html /index.html =404;
    }

    # Projektseiten (Token-Link) und eingeloggte Bereiche: nur SPA-Shell.
    # X-Robots-Tag und Referrer-Policy setzen die maps oben.
    location ~ ^/projekt(?:/[A-Za-z0-9_-]+)?$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, max-age=0" always;
        try_files /spa.html /index.html =404;
    }

    # Abmeldelink aus Rundmails trägt einen Token in der URL: nie cachen.
    location = /abmelden {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, max-age=0" always;
        try_files /spa.html /index.html =404;
    }

    location ~ ^/(?:admin|dashboard)(?:/.*)?$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files /spa.html /index.html =404;
    }

    # Alles andere: vorhandene Datei aus public/ (robots.txt, llms.txt …),
    # sonst echter 404 mit SPA-Shell.
    location / {
        try_files $uri =404;
        error_page 404 /spa.html;

        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # SPA-Shell für 404-Antworten (error_page behält den Status 404).
    # Von außen nicht abrufbar, sonst gäbe es /spa.html als eigene Seite.
    location = /spa.html {
        internal;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, max-age=0" always;
        try_files /spa.html /index.html =404;
    }
}
