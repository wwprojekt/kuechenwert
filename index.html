    <!-- Google Consent Mode v2 – MUSS vor gtag.js geladen werden -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      window.gtag = gtag;

      // DSGVO: Standardmäßig alles verweigert bis Nutzer zustimmt
      // Advanced Consent Mode: Anonymisierte Pings werden auch bei 'denied' gesendet,
      // damit Google Conversions modellieren kann (ca. 70-80% Recovery)
      gtag('consent', 'default', {
        'ad_storage': 'denied',
        'ad_user_data': 'denied',
        'ad_personalization': 'denied',
        'analytics_storage': 'denied',
        'functionality_storage': 'denied',
        'personalization_storage': 'denied',
        'security_storage': 'granted',
        'wait_for_update': 1500
      });

      // Advanced Consent Mode Einstellungen:
      // ads_data_redaction: Wird dynamisch gesetzt – bei denied consent werden Anzeigen-Klick-IDs
      // (gclid) aus Anfragen entfernt. Bei granted consent wird es auf false gesetzt,
      // damit Google Ads Click-IDs (gclid, _gcl_aw Cookie) korrekt weitergegeben werden.
      // url_passthrough=true: Anzeigen-Klick-Info wird über URL-Parameter weitergegeben statt Cookies
      // (wichtig als Fallback wenn Cookies blockiert sind)
      gtag('set', 'ads_data_redaction', true);
      gtag('set', 'url_passthrough', true);

      // Prüfe ob bereits Consent erteilt wurde (z.B. bei Seitenreload nach Cookie-Akzeptanz)
      // Wenn ja, setze ads_data_redaction sofort auf false damit Click-IDs durchkommen
      try {
        var storedConsent = JSON.parse(localStorage.getItem('cookie-consent') || 'null');
        if (storedConsent && storedConsent.marketing === true) {
          gtag('set', 'ads_data_redaction', false);
          gtag('consent', 'update', {
            'analytics_storage': storedConsent.analytics ? 'granted' : 'denied',
            'ad_storage': 'granted',
            'ad_user_data': 'granted',
            'ad_personalization': 'granted',
            'functionality_storage': 'granted',
            'personalization_storage': 'granted'
          });
        } else if (storedConsent && storedConsent.analytics === true) {
          gtag('consent', 'update', {
            'analytics_storage': 'granted',
            'functionality_storage': 'granted',
            'personalization_storage': 'granted'
          });
        }
      } catch(e) {}
    </script>

    <!-- Google Tag (gtag.js) – Google Ads + GA4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-H4BCV8DS0B"></script>
    <script>
      gtag('js', new Date());

      // Google Analytics 4 – CaravanWert Property
      gtag('config', 'G-H4BCV8DS0B', {
        send_page_view: true,
        cookie_domain: 'caravanwert.de',
        cookie_flags: 'SameSite=Lax;Secure',
      });

      // Google Ads – CaravanWert Konto (522-100-4970)
      gtag('config', 'AW-18033517246', {
        send_page_view: false,
        allow_enhanced_conversions: true,
      });
    </script>

    <!-- Meta Pixel Base Code – DSGVO-konform -->
    <!-- Wird erst aktiviert wenn Marketing-Consent erteilt wird.
         fbq('consent', 'revoke') verhindert jegliches Tracking bis Consent vorliegt.
         Die Aktivierung erfolgt über metaPixelService.ts bei consent-updated Event. -->
    <script>
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');

      // DSGVO: Pixel initialisieren aber sofort Consent widerrufen
      // Damit werden KEINE Daten gesendet bis explizit fbq('consent','grant') aufgerufen wird
      fbq('consent', 'revoke');
      fbq('init', '1846623132710484');
    </script>
    <!-- Clixtell Click-Fraud Protection -->
    <script type='text/javascript'>
      var script=document.createElement('script');
      var prefix=document.location.protocol;
      script.async=true;script.type='text/javascript';
      var target=prefix + '//scripts.clixtell.com/track.js';
      script.src=target;var elem=document.head;
      elem.appendChild(script);
    </script>
