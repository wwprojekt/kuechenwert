<!doctype html>
<html lang="de" translate="no">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content tells Chrome to resize the layout
         viewport when the on-screen keyboard opens, so sticky bottom-nav
         buttons (e.g. in the Verkaufs-Wizard) stay above the keyboard.
         iOS Safari ignores this, but also respects position:sticky within
         scrollable containers. viewport-fit=cover enables env(safe-area-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />

    <!-- Block automatic browser translation (Chrome/Edge/Safari/Firefox).
         Reason: Chrome's auto-translate replaces text nodes inside React's
         DOM with <font> wrappers. When React tries to remove a text node
         it owns, the node is no longer a child of its parent, throwing
         "Failed to execute 'removeChild' on 'Node'" and breaking the
         provider tree (cascading "useSettings must be used within a
         SettingsProvider" errors after recovery remount).
         The site is German-only — translation breaks the app and is not
         worth the residual benefit for a tiny minority of non-DE visitors. -->
    <meta name="google" content="notranslate" />
    
    <!-- Icons: ICO fuer Alt-Clients/Crawler, SVG fuer moderne Browser,
         Apple Touch als PNG (iOS rendert kein SVG). Rasterdateien erzeugt
         scripts/generate-logo-assets.mjs. -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#336753" />

    <!-- Preconnect for critical resources.
         Supabase preconnect (statt nur dns-prefetch) ist kritisch, weil JEDE
         Page-Load Daten + Photos von dort braucht. dns-prefetch löst nur
         DNS auf — preconnect macht zusätzlich TCP+TLS-Handshake (~300 ms
         gespart auf 4G, gemessen via Lighthouse 2026-04-20). -->
    <link rel="preconnect" href="https://gzqayoalwtmypndrmqes.supabase.co" crossorigin />

    <!-- LCP-Hero-Image: liegt als gehashtes Vite-Asset unter
         /assets/hero-kitchen-<hash>.webp im Bundle. Kein static preload hier,
         weil der Hash build-abhaengig ist. Vite fuegt den optimalen Ladepfad
         per <link rel=modulepreload> + Code-Splitting selbst ein. -->
    <!-- Preconnect fuer Unsplash faellt weg, weil der Hero jetzt lokal kommt. -->

    <!-- Fira Sans kommt als eigenes Asset aus dem Bundle (@fontsource, src/main.tsx):
         keine Anfrage an Google-Server. vite.config.ts lädt die Schnitte 400/600/800
         per <link rel=preload> vor und setzt font-display: optional. -->

    <!-- Google Consent Mode v2: Standardwerte vor jedem Google-Tag. Externe
         Datei statt Inline-Skript, damit die CSP ohne 'unsafe-inline' auskommt. -->
    <script src="/js/consent-bootstrap.js"></script>

    <!-- Primary Meta Tags. Tags mit data-rh="true" sind Rückfallwerte, die
         react-helmet-async durch die Werte der jeweiligen Seite ersetzt
         (PageLayout, FunnelSeo), statt sie zu verdoppeln. Tags ohne data-rh
         gelten für alle Seiten und stehen nur hier. robots, canonical und
         og:url setzt ausschließlich die Seite selbst. -->
    <title>KüchenWert — Traumküche mit KI planen, Preis sehen & Studio-Angebote vergleichen</title>
    <meta name="description" content="Foto Ihres Raums hochladen, Küche konfigurieren und sofort sehen, wie sie aussieht und was sie ungefähr kostet. Geprüfte Küchenstudios machen Ihnen Angebote – Sie wählen. Kostenlos & unverbindlich." data-rh="true" />
    <meta name="keywords" content="Küche planen, Küchenplaner online, Küche visualisieren, KI Küchenplaner, Küche Preis berechnen, Küchenstudio Angebote vergleichen, neue Küche kaufen, Küchen Preisvergleich, Nobilia, Häcker, Nolte, KüchenWert" data-rh="true" />
    <meta name="author" content="KüchenWert" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" data-rh="true" />
    <meta property="og:site_name" content="KüchenWert" />
    <meta property="og:locale" content="de_DE" />
    <meta property="og:title" content="KüchenWert — Ihre Traumküche im eigenen Raum visualisiert" data-rh="true" />
    <meta property="og:description" content="Foto hochladen, Küche konfigurieren, Preis sehen – und Angebote geprüfter Küchenstudios vergleichen. Kostenlos & unverbindlich." data-rh="true" />
    <meta property="og:image" content="https://kuechenwert24.de/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Küche vorher und als KI-Vorschau nachher – KüchenWert visualisiert die Traumküche im eigenen Raum" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KüchenWert — Ihre Traumküche im eigenen Raum visualisiert" data-rh="true" />
    <meta name="twitter:description" content="Foto hochladen, Küche konfigurieren, Preis sehen – und Angebote geprüfter Küchenstudios vergleichen." data-rh="true" />
    <meta name="twitter:image" content="https://kuechenwert24.de/og-image.jpg" />

    <!-- Kein statisches Organization-Schema: Startseite und /ueber-uns liefern
         es über PageLayout (src/lib/seo.ts), sonst stünde es dort doppelt. -->
  </head>

  <body class="notranslate">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- ═══════════════════════════════════════════════════════════════════
         DEFERRED THIRD-PARTY SCRIPTS — loaded AFTER first paint
         These scripts are non-essential for initial page rendering.
         Loading them after the app improves FCP/LCP by 1-3 seconds on mobile.
         Der Loader lädt gtag, Meta Pixel und UET erst nach Einwilligung.
         ═══════════════════════════════════════════════════════════════════ -->
    <script src="/js/tracking-loader.js"></script>
  </body>
</html>
