name: Deploy Production (Dokploy)

# Jeder Push auf main wird geprüft und danach über die Dokploy-API deployt.
# Das Dokploy-Panel läuft hinter Cloudflare unter https://deploy.kuechenwert24.de.
# Benötigte Repo-Secrets (Settings → Secrets and variables → Actions):
#   DOKPLOY_API_KEY  Dokploy → Profil → API/CLI → Token
#   DOKPLOY_APP_ID   applicationId der KüchenWert-App (nur diese App!)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, Lint, Tests, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Version aus "packageManager" in package.json (wie im Dockerfile)
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Gleiche Major-Version wie das Docker-Image (node:22-alpine)
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Strikter Typecheck (neuer Code)
        run: npm run typecheck

      # Nur Fehler brechen ab; Warnungen werden angezeigt, blockieren aber nicht.
      - name: ESLint
        run: npx eslint src

      - name: Unit-Tests
        run: npx vitest run

      - name: Produktions-Build
        run: npm run build

  deploy:
    name: Dokploy-Deploy auslösen
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Deploy anstoßen
        env:
          DOKPLOY_URL: https://deploy.kuechenwert24.de
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APP_ID: ${{ secrets.DOKPLOY_APP_ID }}
        run: |
          if [ -z "$DOKPLOY_API_KEY" ] || [ -z "$DOKPLOY_APP_ID" ]; then
            echo "::error::Repo-Secrets DOKPLOY_API_KEY und DOKPLOY_APP_ID fehlen – Produktion wurde NICHT aktualisiert."
            exit 1
          fi
          curl --fail-with-body -sS -X POST "${DOKPLOY_URL%/}/api/application.deploy" \
            -H "accept: application/json" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${DOKPLOY_API_KEY}" \
            -d "{\"applicationId\":\"${DOKPLOY_APP_ID}\"}"
