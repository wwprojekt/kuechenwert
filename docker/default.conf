# Default server configuration for CaravanWert
# Optimized for Dokploy/Cloudflare (SSL termination at proxy)
# Origin server only listens on HTTP (port 80)

# Redirect www to non-www (handled at origin level)
server {
    listen 80;
    listen [::]:80;
    server_name www.caravanwert.de;
    return 301 https://caravanwert.de$request_uri;
}

# Main server block - HTTP only (SSL handled by proxy)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    
    root /usr/share/nginx/html;
    index index.html;

    # Trailing slash normalization: redirect /path/ to /path (except root)
    rewrite ^(.+)/$ $1 permanent;

    # Security headers (respect X-Forwarded-Proto from proxy)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    
    # HSTS - only if behind HTTPS proxy (set by proxy, not origin)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Content Security Policy
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; media-src 'self' https:; object-src 'none'; frame-src 'self' https://www.youtube.com https://player.vimeo.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://www.google-analytics.com; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests;" always;

    # Hide nginx version
    server_tokens off;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Handle static assets with caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
        
        # CORS for fonts and assets
        add_header Access-Control-Allow-Origin "*";
        
        # Gzip static assets
        gzip_static on;
        
        # Try to serve file, fallback to 404
        try_files $uri =404;
    }

    # Handle API routes (proxy to Supabase if needed)
    location /api/ {
        # Rate limiting for API calls
        limit_req zone=api burst=20 nodelay;
        
        # Add security headers
        add_header X-Robots-Tag "noindex, nofollow" always;
        
        # For SPA, this might not be needed since Supabase is external
        return 404;
    }

    # Handle authentication routes with stricter rate limiting
    location ~ ^/(login|register|auth) {
        limit_req zone=auth burst=5 nodelay;
        try_files $uri $uri/ /index.html;
    }

    # Sitemap - serve static or proxy to edge function if needed
    location = /sitemap.xml {
        try_files $uri /sitemap.xml;
        add_header Content-Type "application/xml";
        add_header Cache-Control "public, max-age=3600";
    }

    # Handle all other routes (SPA routing)
    location / {
        # Try to serve file, fallback to index.html for SPA routing
        try_files $uri /index.html;
        
        # Cache control for HTML files
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Security: Block access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Security: Block access to sensitive files
    location ~* \.(env|log|htaccess|htpasswd|ini|phps|fla|psd|sh)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
