<!doctype html>
<html lang="de" translate="no">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content tells Chrome to resize the layout
         viewport when the on-screen keyboard opens, so sticky bottom-nav
         buttons (e.g. in the Verkaufs-Wizard) stay above the keyboard.
         iOS Safari ignores this, but also respects position:sticky within
         scrollable containers. viewport-fit=cover enables env(safe-area-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />

    <!-- Block automatic browser translation (Chrome/Edge/Safari/Firefox).
         Reason: Chrome's auto-translate replaces text nodes inside React's
         DOM with <font> wrappers. When React tries to remove a text node
         it owns, the node is no longer a child of its parent, throwing
         "Failed to execute 'removeChild' on 'Node'" and breaking the
         provider tree (cascading "useSettings must be used within a
         SettingsProvider" errors after recovery remount).
         The site is German-only — translation breaks the app and is not
         worth the residual benefit for a tiny minority of non-DE visitors. -->
    <meta name="google" content="notranslate" />
    
    <!-- Favicon — webp for smaller size, png fallback for Apple -->
    <link rel="icon" type="image/webp" href="/favicon.webp" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Preconnect for critical resources.
         Supabase preconnect (statt nur dns-prefetch) ist kritisch, weil JEDE
         Page-Load Daten + Photos von dort braucht. dns-prefetch löst nur
         DNS auf — preconnect macht zusätzlich TCP+TLS-Handshake (~300 ms
         gespart auf 4G, gemessen via Lighthouse 2026-04-20). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://gzqayoalwtmypndrmqes.supabase.co" crossorigin />

    <!-- LCP-Hero-Image preload: wird aktuell via Unsplash-CDN geladen.
         Sobald eigene Kuechen-Assets in /public/images/ liegen, hier
         wieder ein preload mit imagesrcset aktivieren. -->
    <link
      rel="preload"
      as="image"
      href="https://images.unsplash.com/photo-1556909114-f6e7ad7d3136?auto=format&fit=crop&w=1920&q=80"
      fetchpriority="high"
    />

    <!-- Google Fonts — loaded NON-BLOCKING via media trick.
         Browser loads CSS with media="print" (non-render-blocking),
         then switches to media="all" once loaded. display=swap shows
         system font immediately, swaps to Fira Sans when ready. -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700;800&display=swap" as="style" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700;800&display=swap" /></noscript>

    <!-- Google Consent Mode v2 — minimal inline, MUST load before gtag -->
    <script>
      window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}window.gtag=gtag;
      gtag('consent','default',{'ad_storage':'denied','ad_user_data':'denied','ad_personalization':'denied','analytics_storage':'denied','functionality_storage':'denied','personalization_storage':'denied','security_storage':'granted','wait_for_update':1500});
      gtag('set','ads_data_redaction',true);gtag('set','url_passthrough',true);
      try{var c=JSON.parse(localStorage.getItem('cookie-consent')||'null');if(c&&c.marketing){gtag('set','ads_data_redaction',false);gtag('consent','update',{'analytics_storage':c.analytics?'granted':'denied','ad_storage':'granted','ad_user_data':'granted','ad_personalization':'granted','functionality_storage':'granted','personalization_storage':'granted'})}else if(c&&c.analytics){gtag('consent','update',{'analytics_storage':'granted','functionality_storage':'granted','personalization_storage':'granted'})}}catch(e){}
    </script>
    
    <!-- Clixtell wird in loadDeferredScripts() unten geladen, nach erstem Paint
         und nur wenn der User Marketing/Analytics-Consent gegeben hat. Das
         frühere unkonditionale Inline-Script lud `track.js` + `recorder.js`
         (Session-Recorder, mehrere hundert KB JS) auf jedem Pageload, hookte
         Maus-/Scroll-Events und crashte regelmäßig mit "Cannot read length".
         DSGVO-konform laden wir es erst nach explizitem Consent. -->

    <!-- Primary Meta Tags -->
    <title>KüchenWert — Küche verkaufen & kaufen | Kostenlose Bewertung in 2 Min</title>
    <meta name="description" content="Verkaufen Sie Ihre gebrauchte Küche schnell zum fairen Preis oder finden Sie Ihre Traumküche. Kostenlose Bewertung, geprüfte Küchen-Händler, unverbindlich." />
    <meta name="keywords" content="Küche verkaufen, Küche kaufen, gebrauchte Küche, Küchen Bewertung, Nobilia verkaufen, Häcker verkaufen, Küchenwert, Küchen Wertrechner" />
    <meta name="author" content="KüchenWert" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="KüchenWert" />
    <meta property="og:locale" content="de_DE" />
    <meta property="og:title" content="KüchenWert — Küche verkaufen & kaufen" />
    <meta property="og:description" content="Kostenlose Bewertung Ihrer Küche in 2 Minuten. Geprüfte Küchen-Händler bieten — Sie entscheiden." />
    <meta property="og:url" content="https://kuechenwert24.de" />

    <!-- Twitter -->

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",

      "description": "Deutschlands Marktplatz für gebrauchte Küchen — kostenlose Bewertung, geprüfte Küchen-Händler.",
      "url": "https://kuechenwert24.de",
      "logo": "https://kuechenwert24.de/og-image.png",
      "image": "https://kuechenwert24.de/og-image.png",

  </head>

  <body class="notranslate">
    <!-- Clixtell noscript-Fallback -->
    <noscript><img src='//tracker.clixtell.com/track/t.gif' height="1" width="1" style="display:none"></noscript>
    <!-- Meta Pixel noscript-Fallback -->
    <noscript>
      <img height="1" width="1" style="display:none"
           src="https://www.facebook.com/tr?id=1846623132710484&ev=PageView&noscript=1" />
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- ═══════════════════════════════════════════════════════════════════
         DEFERRED THIRD-PARTY SCRIPTS — loaded AFTER first paint
         These scripts are non-essential for initial page rendering.
         Loading them after the app improves FCP/LCP by 1-3 seconds on mobile.
         ═══════════════════════════════════════════════════════════════════ -->
    <script>
      // Default tracking IDs (initial page load fallback). The Admin-Backend can
      // override these at runtime via site_settings.tracking_config – the React
      // app reads the DB row, dispatches a 'tracking-config-updated' window event
      // and the listener below re-initialises gtag/fbq with the new IDs if they
      // differ. Cached overrides are kept in localStorage so the *next* full
      // page load already uses the latest IDs without waiting for the DB call.
      window.__TRACKING_BOOT__ = {
        ga4: 'G-H4BCV8DS0B',
        gads: 'AW-18033517246',
        gtm: '',
        fb:  '1846623132710484',
        // Microsoft Advertising (Bing) UET — leer bis im Admin-Backend gesetzt.
        // Wenn leer wird KEIN UET-Pixel geladen (siehe loadUet()).
        uet: '',
        loaded: { ga4: '', gads: '', gtm: '', fb: '', uet: '' }
      };
      try {
        var cached = JSON.parse(localStorage.getItem('tracking-config-cache') || 'null');
        if (cached && typeof cached === 'object') {
          if (cached.ga4)  window.__TRACKING_BOOT__.ga4  = String(cached.ga4);
          if (cached.gads) window.__TRACKING_BOOT__.gads = String(cached.gads);
          if (cached.gtm)  window.__TRACKING_BOOT__.gtm  = String(cached.gtm);
          if (cached.fb)   window.__TRACKING_BOOT__.fb   = String(cached.fb);
          if (cached.uet)  window.__TRACKING_BOOT__.uet  = String(cached.uet);
        }
      } catch (e) {}

      function configureGtag(ga4Id, gadsId, sendPageView, allowEnhanced) {
        if (typeof gtag !== 'function') return;
        if (ga4Id && window.__TRACKING_BOOT__.loaded.ga4 !== ga4Id) {
          gtag('config', ga4Id, {
            send_page_view: sendPageView !== false,
            cookie_domain: 'caravanwert.de',
            cookie_flags: 'SameSite=Lax;Secure',
          });
          window.__TRACKING_BOOT__.loaded.ga4 = ga4Id;
        }
        if (gadsId && window.__TRACKING_BOOT__.loaded.gads !== gadsId) {
          gtag('config', gadsId, {
            send_page_view: false,
            allow_enhanced_conversions: allowEnhanced !== false,
          });
          window.__TRACKING_BOOT__.loaded.gads = gadsId;
        }
      }

      function loadGtagJs(ga4Id, gadsId, gtmId) {
        // We only need ONE gtag.js script tag – it accepts events for any
        // configured GA4/AW/GTM ID. Load with the GA4 ID (or GTM if no GA4).
        var primary = ga4Id || gtmId || gadsId;
        if (!primary) return;
        var existing = document.querySelector('script[data-tracking-loader="1"]');
        if (existing && existing.getAttribute('data-id') === primary) return;
        if (existing && existing.parentNode) existing.parentNode.removeChild(existing);
        var g = document.createElement('script');
        g.async = true;
        g.setAttribute('data-tracking-loader', '1');
        g.setAttribute('data-id', primary);
        g.src = 'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(primary);
        g.onload = function() {
          gtag('js', new Date());
          configureGtag(ga4Id, gadsId, true, true);
          if (gtmId && /^GTM-[A-Z0-9]+$/.test(gtmId)) {
            // GTM container – loaded via gtag.js syntax (works for both GA4 + GTM)
            gtag('config', gtmId);
          }
        };
        document.head.appendChild(g);
      }

      function loadFbq(pixelId) {
        if (!pixelId) return;
        if (window.__TRACKING_BOOT__.loaded.fb === pixelId) return;
        try {
          if (typeof fbq !== 'function') {
            !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
          }
          if (typeof fbq === 'function') {
            fbq('consent','revoke');
            fbq('init', pixelId);
            window.__TRACKING_BOOT__.loaded.fb = pixelId;
          }
        } catch (e) {}
      }

      // Microsoft Advertising (Bing) UET — analog zu Meta Pixel.
      // - Wird nur geladen wenn `tagId` gesetzt UND Marketing-Consent gegeben.
      // - Idempotent: gleiche tagId zweimal aufrufen lädt das Pixel nicht doppelt.
      // - DSGVO: gating durch hasMarketingConsent() (gleiche Logik wie Clixtell).
      function loadUet(tagId) {
        if (!tagId) return;
        if (window.__TRACKING_BOOT__.loaded.uet === tagId) return;
        if (!hasMarketingConsent()) return;
        try {
          // UET-Pixel-Loader (Microsoft Standard-Snippet, nur Tag-ID dynamisch).
          // Initialisiert window.uetq als Push-Queue und lädt bat.js asynchron.
          (function(w,d,t,r,u){
            var f,n,i;
            w[u]=w[u]||[];
            f=function(){
              var o={ti: tagId, enableAutoSpaTracking: true};
              o.q=w[u];
              w[u]=new w.UET(o);
              w[u].push("pageLoad");
            };
            n=d.createElement(t);
            n.src=r;
            n.async=1;
            n.onload=n.onreadystatechange=function(){
              var s=this.readyState;
              if(s && s!=="loaded" && s!=="complete") return;
              f();
              n.onload=n.onreadystatechange=null;
            };
            i=d.getElementsByTagName(t)[0];
            i.parentNode.insertBefore(n,i);
          })(window,document,"script","//bat.bing.com/bat.js","uetq");
          window.__TRACKING_BOOT__.loaded.uet = tagId;
        } catch (e) {}
      }

      function hasMarketingConsent() {
        try {
          var c = JSON.parse(localStorage.getItem('cookie-consent') || 'null');
          return !!(c && c.marketing);
        } catch (e) { return false; }
      }

      function loadClixtell() {
        if (window.__CLIXTELL_LOADED__) return;
        // Click Fraud Protection ist Marketing-Tracking → nur mit Consent.
        // Vorher unkonditional inline geladen, was DSGVO-Probleme + ~300 KB
        // recorder.js + häufige Konsolen-Crashes verursachte.
        if (!hasMarketingConsent()) return;
        window.__CLIXTELL_LOADED__ = true;
        var s = document.createElement('script');
        s.async = true;
        s.src = (document.location.protocol === 'https:' ? 'https:' : 'http:') + '//scripts.clixtell.com/track.js';
        document.head.appendChild(s);
      }

      function loadDeferredScripts() {
        var b = window.__TRACKING_BOOT__;
        loadGtagJs(b.ga4, b.gads, b.gtm);
        loadFbq(b.fb);
        loadUet(b.uet);
        loadClixtell();

        // Cloudflare Turnstile (statisch – kein Tracking-Config-Eingriff nötig)
        var t = document.createElement('script');
        t.async = true;
        t.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
        document.head.appendChild(t);
      }

      // Wenn Consent erst nachträglich erteilt wird (CookieBanner Akzeptieren),
      // Clixtell sofort nachladen — der CookieBanner dispatched dieses Event
      // (siehe src/components/CookieBanner.tsx + CookieSettingsModal.tsx).
      window.addEventListener('consent-updated', function () {
        loadClixtell();
        // Bing UET wird analog zu Clixtell erst nach Marketing-Consent aktiviert
        try { loadUet(window.__TRACKING_BOOT__.uet); } catch (e) {}
      });

      // React publishes the loaded tracking-config via this event. We persist
      // it in localStorage so the next page load uses the fresh IDs immediately,
      // and we re-init scripts on the fly if the IDs changed.
      window.addEventListener('tracking-config-updated', function (e) {
        try {
          var cfg = (e && e.detail) || null;
          if (!cfg) return;
          var newIds = {
            ga4:  cfg.ga4 && cfg.ga4.measurement_id ? String(cfg.ga4.measurement_id) : '',
            gads: cfg.google_ads && cfg.google_ads.conversion_id ? String(cfg.google_ads.conversion_id) : '',
            gtm:  cfg.gtm && cfg.gtm.enabled && cfg.gtm.container_id ? String(cfg.gtm.container_id) : '',
            fb:   cfg.meta_pixel && cfg.meta_pixel.pixel_id ? String(cfg.meta_pixel.pixel_id) : '',
            uet:  cfg.microsoft_ads && cfg.microsoft_ads.enabled && cfg.microsoft_ads.uet_tag_id
                    ? String(cfg.microsoft_ads.uet_tag_id) : ''
          };
          try { localStorage.setItem('tracking-config-cache', JSON.stringify(newIds)); } catch (err) {}
          var b = window.__TRACKING_BOOT__;
          // Only re-init gtag if neither the GA4 nor the Ads ID have been
          // configured yet for the new IDs (configureGtag is idempotent).
          if (newIds.ga4 && newIds.ga4 !== b.loaded.ga4) {
            b.ga4 = newIds.ga4;
            loadGtagJs(newIds.ga4, newIds.gads || b.gads, newIds.gtm || b.gtm);
          } else if (newIds.gads && newIds.gads !== b.loaded.gads) {
            b.gads = newIds.gads;
            configureGtag(b.ga4, newIds.gads, true, !!(cfg.google_ads && cfg.google_ads.allow_enhanced_conversions));
          }
          if (newIds.fb && newIds.fb !== b.loaded.fb) {
            b.fb = newIds.fb;
            loadFbq(newIds.fb);
          }
          if (newIds.uet && newIds.uet !== b.loaded.uet) {
            b.uet = newIds.uet;
            loadUet(newIds.uet);
          }
        } catch (err) {}
      });

      // Use requestIdleCallback if available, otherwise setTimeout
      if ('requestIdleCallback' in window) {
        requestIdleCallback(loadDeferredScripts, { timeout: 3000 });
      } else {
        setTimeout(loadDeferredScripts, 1500);
      }
    </script>
  </body>
</html>
