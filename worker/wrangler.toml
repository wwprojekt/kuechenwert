name = "kuechenwert-prerender"
main = "dist/index.js"
compatibility_date = "2026-03-22"
compatibility_flags = ["nodejs_compat"]

# KV Namespace for caching rendered pages
kv_namespaces = [
  { binding = "PRERENDER_CACHE", id = "073bb1aa9a4c47a0ac2408f647e79f47" }
]

# Non-sensitive variables
[vars]
CF_ACCOUNT_ID = "4e101512091f867faf40ab7798abee0c"
# Supabase: URL + ANON_KEY sind public (im Frontend-Bundle ausgeliefert).
# Keine Geheimnisse — Rotation würde sowieso einen Frontend-Rebuild erfordern.
SUPABASE_URL = "https://gzqayoalwtmypndrmqes.supabase.co"
SUPABASE_ANON_KEY = "sb_publishable_y310eCMmlhSjvXbOKDgY1Q_p2v56GAz"

# Routes
# Hinweis: Der Worker ist aktuell NICHT deployed fuer KuechenWert — das
# Image-Proxy ist in src/lib/imageTransform.ts auf null geschaltet.
# Die Routes sind vorkonfiguriert, falls der Worker spaeter (fuer Prerender /
# Image-Proxy) aktiviert wird. Domain kuechenwert.de ist ueber Cloudflare
# proxied; kuechenwert24.de laeuft ueber Dokploy/Traefik (nicht via CF) und ist
# daher bewusst nicht als Worker-Route eingetragen.
[[routes]]
pattern = "kuechenwert.de/*"
zone_name = "kuechenwert.de"

[[routes]]
pattern = "www.kuechenwert.de/*"
zone_name = "kuechenwert.de"
