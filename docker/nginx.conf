# Nginx configuration for KüchenWert production
# Optimized for performance and security

# Master-Prozess läuft als root (für privileged ops wie Volume-Sync via
# /docker-entrypoint.d/ Scripts und Port 80 Bind), Worker forken zum
# unprivileged 'nginx'-User. Standard nginx security-Pattern.
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
# PID-Pfad: /var/cache/nginx/ statt /tmp/ weil Docker Swarm (Dokploy) je
# nach Service-Recreate /tmp unterschiedlich mountet (manchmal tmpfs,
# manchmal mit anderen Permissions). /var/cache/nginx wird im Image
# explizit chown nginx:nginx gesetzt und ist dadurch deterministisch
# writable — unabhängig von Swarm-Mount-Varianten.
# Historischer Bug: 2026-04-24 crashloop "open() /tmp/nginx.pid failed
# (13: Permission denied)" nach Stop→Start in Dokploy.
pid /var/cache/nginx/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format (enhanced for proxy)
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'proto=$http_x_forwarded_proto';
    
    # Echte Client-IP (Logs, Rate-Limits) aus CF-Connecting-IP, aber nur wenn
    # die Verbindung von Cloudflare oder vom Proxy im privaten Netz
    # (Dokploy/Traefik) kommt. Sonst könnte jeder Client per Header eine
    # beliebige IP vorgeben und die Rate-Limits umgehen.
    # Cloudflare-Netze Stand 2026-09-28 (https://www.cloudflare.com/ips/),
    # bei Änderungen dort hier nachziehen.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    # Private Netze (Docker/Swarm-Overlay, Traefik) und Loopback
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;

    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Brotli compression (if available)
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Note: Security headers are configured in default.conf server block
    # add_header directives must be in server/location blocks, not http block

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=1r/s;
    
    # Include server configurations
    include /etc/nginx/conf.d/*.conf;
}
