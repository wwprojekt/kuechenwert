# Default server configuration for CaravanWert
# Optimized for Dokploy/Cloudflare (SSL termination at proxy)
# Origin server only listens on HTTP (port 80)

# Redirect www to non-www (handled at origin level)
server {
    listen 80;
    listen [::]:80;
    server_name www.caravanwert.de;
    return 301 https://caravanwert.de$request_uri;
}

# Main server block - HTTP only (SSL handled by proxy)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    
    root /usr/share/nginx/html;
    index index.html;

    # DNS resolver for proxy_pass (e.g. Supabase Edge Functions for sitemap.xml).
    # Uses Google + Cloudflare public DNS, since the alpine container has no
    # local resolver beyond /etc/resolv.conf which nginx ignores at runtime.
    resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;
    resolver_timeout 10s;

    # Trailing slash normalization: redirect /path/ to /path (except root)
    rewrite ^(.+)/$ $1 permanent;

    # Security headers (respect X-Forwarded-Proto from proxy)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    
    # HSTS - only if behind HTTPS proxy (set by proxy, not origin)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Content Security Policy
    # CSP: Alle Google Ads, GA4, Meta Pixel und Cloudflare Domains erlaubt
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com https://googleads.g.doubleclick.net https://www.googleadservices.com https://connect.facebook.net https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https: http:; media-src 'self' https:; object-src 'none'; frame-src 'self' https://www.google.com https://www.youtube.com https://player.vimeo.com https://td.doubleclick.net; connect-src 'self' https://*.supabase.co https://*.supabase.in wss://*.supabase.co https://www.google-analytics.com https://analytics.google.com https://region1.google-analytics.com https://www.googletagmanager.com https://googleads.g.doubleclick.net https://www.googleadservices.com https://td.doubleclick.net https://connect.facebook.net https://www.facebook.com https://api.resend.com https://static.cloudflareinsights.com; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests;" always;

    # Hide nginx version
    server_tokens off;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Service Worker MUST never be cached aggressively, otherwise browsers
    # and CDNs hold on to old SW versions forever. Always revalidate.
    location = /sw.js {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }

    # PWA manifest and root index.html: revalidate on every load
    location = /manifest.json {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Handle static assets with caching (hashed Vite chunks under /assets/* are
    # safe to cache forever; everything else uses default no-cache from /).
    #
    # WICHTIG: webp/avif MÜSSEN drin sein — sonst fällt jedes WebP-Bild durch
    # zum SPA-Catch-all (location /) und bekommt no-cache,no-store-Headers.
    # Cloudflare zeigt dann CF-Cache-Status: BYPASS, jeder User lädt das
    # Hero-Bild + alle Listing-Thumbnails bei jedem Pageload neu vom Origin.
    # (Bug bestand bis 2026-04-19, ~5 MB Re-Download pro Page-Load.)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|eot|mp4|webm|ogg|pdf)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Vary "Accept-Encoding" always;
        
        # CORS for fonts and assets
        add_header Access-Control-Allow-Origin "*" always;
        
        # Gzip static assets
        gzip_static on;
        
        # Try to serve file, fallback to 404
        try_files $uri =404;
    }

    # Handle API routes (proxy to Supabase if needed)
    location /api/ {
        # Rate limiting for API calls
        limit_req zone=api burst=20 nodelay;
        
        # Add security headers
        add_header X-Robots-Tag "noindex, nofollow" always;
        
        # For SPA, this might not be needed since Supabase is external
        return 404;
    }

    # Handle authentication routes with stricter rate limiting
    location ~ ^/(login|register|auth) {
        limit_req zone=auth burst=5 nodelay;
        try_files $uri $uri/ /index.html;
    }

    # Sitemap - dynamically generated by Supabase Edge Function
    # Proxy /sitemap.xml to the public Edge Function so Google can crawl
    # https://caravanwert.de/sitemap.xml directly.
    # NOTE: hostname is in a variable so nginx uses the resolver at runtime
    # instead of only at startup (avoids stale-IP issues after Supabase deploys).
    location = /sitemap.xml {
        set $sitemap_upstream "zcrwqxsyptjwkuxfacvq.supabase.co";
        proxy_pass https://$sitemap_upstream/functions/v1/sitemap;
        proxy_set_header Host $sitemap_upstream;
        proxy_ssl_server_name on;
        proxy_ssl_name $sitemap_upstream;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_http_version 1.1;
        proxy_set_header Accept-Encoding "";
        proxy_hide_header Cache-Control;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Content-Type "application/xml";
        add_header Cache-Control "public, max-age=3600, s-maxage=3600";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Handle all other routes (SPA routing)
    location / {
        # Try to serve file, fallback to index.html for SPA routing
        try_files $uri /index.html;
        
        # Cache control for HTML files
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Security: Block access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Security: Block access to sensitive files
    location ~* \.(env|log|htaccess|htpasswd|ini|phps|fla|psd|sh)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
